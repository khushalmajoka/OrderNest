# Runs on GitHub's own machines when backend code changes. It uses only empty,
# throwaway databases: no secrets and no real data are needed or available.
name: Backend checks

on:
  push:
    paths:
      - "server/**"
      - "server-java/**"
      - "compare-tests/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "server/**"
      - "server-java/**"
      - "compare-tests/**"
      - ".github/workflows/backend-checks.yml"

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp verify
        working-directory: server-java

  compare:
    name: Compare the servers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      # Node against Node for now. Java is compared here once it has features.
      - run: node compare-tests/run.js

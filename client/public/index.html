<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the chosen look before anything is drawn (see src/common/utils/theme.js)
      try {
        var t = localStorage.getItem("theme");
        if (t === "classic" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#1f1d1b" : "#fff7ed");
        }
      } catch (e) {}
    </script>
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="OrderNest: manage and track shop orders"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>OrderNest</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
  </body>
</html>
